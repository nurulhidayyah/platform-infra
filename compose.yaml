# Backing services platform. Setiap port dibuka di dua alamat, dan keduanya
# tidak bisa dijangkau dari internet:
#   127.0.0.1   untuk host, dan untuk PC lewat SSH port forwarding
#   172.30.0.1  gateway network `platform`, untuk pod di k3s
# Gateway itu dibuat Docker sendiri, jadi selalu ada tanpa menunggu k3s. Alamat
# cni0 k3s (10.42.0.1) baru ada setelah k3s start; setelah reboot Docker
# biasanya lebih dulu, lalu container gagal start karena alamatnya belum ada.
# Aturan nama dan port: README.
name: platform

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: platform-postgres
    restart: unless-stopped
    env_file: env/postgres.env
    ports:
      - "127.0.0.1:5432:5432"
      - "172.30.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4.11
    container_name: platform-mysql
    restart: unless-stopped
    env_file: env/mysql.env
    ports:
      # 3306 di host sudah dipakai MySQL milik absensi.
      - "127.0.0.1:3307:3306"
      - "172.30.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7.4.11-alpine
    container_name: platform-redis
    restart: unless-stopped
    env_file: env/redis.env
    entrypoint: ["/bin/sh", "/platform/entrypoint.sh"]
    ports:
      - "127.0.0.1:6379:6379"
      - "172.30.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/entrypoint.sh:/platform/entrypoint.sh:ro
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user default --pass \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.1.0
    container_name: platform-garage
    restart: unless-stopped
    env_file: env/garage.env
    ports:
      # Hanya API S3. RPC (3901) dan admin (3903) tidak dibuka ke host.
      - "127.0.0.1:3900:3900"
      - "172.30.0.1:3900:3900"
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./garage/garage.toml:/etc/garage.toml:ro
    mem_limit: 256m
    healthcheck:
      # Image-nya tanpa shell, jadi binary garage sendiri yang memeriksa.
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage-webui:
    # UI komunitas untuk Garage: bucket, kunci, kuota, dan penjelajah objek.
    image: khairul169/garage-webui:1.1.0
    container_name: platform-garage-webui
    restart: unless-stopped
    env_file: env/garage-webui.env
    environment:
      API_BASE_URL: http://platform-garage:3903
      S3_ENDPOINT_URL: http://platform-garage:3900
      S3_REGION: garage
    ports:
      - "127.0.0.1:3909:3909"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    mem_limit: 64m
    depends_on:
      garage:
        condition: service_healthy

  registry:
    image: registry:3.0.0
    container_name: platform-registry
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry_data:/var/lib/registry
      - ./registry/config.yml:/etc/distribution/config.yml:ro
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 10s
      timeout: 5s
      retries: 5

  jenkins:
    build: ./jenkins
    image: platform-jenkins:2.568.3
    container_name: platform-jenkins
    restart: unless-stopped
    # Network host: 127.0.0.1 di dalam Jenkins sama dengan 127.0.0.1 di VPS, jadi
    # registry dan port uji Testcontainers terjangkau apa adanya. Port yang
    # didengar proses di network host tetap dijaga ufw, berbeda dengan port yang
    # dipublikasikan Docker. UI hanya di 127.0.0.1:8090.
    network_mode: host
    env_file: env/jenkins.env
    environment:
      JENKINS_OPTS: --httpListenAddress=127.0.0.1 --httpPort=8090
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xmx768m
      CASC_JENKINS_CONFIG: /casc/jenkins.yaml
    # GID grup docker di host, supaya user jenkins boleh memakai soket Docker.
    # Siapa pun yang menjalankan pipeline praktis punya root di VPS: hanya repo
    # milik sendiri yang boleh memicu build.
    group_add:
      - "${DOCKER_GID:-998}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc:/casc:ro
      - ./secrets/gitops-deploy-key:/run/secrets/gitops-deploy-key:ro
      - /var/run/docker.sock:/var/run/docker.sock
    cpus: 2
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8090/login"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: platform-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: platform-prometheus
    restart: unless-stopped
    # Network host: API k3s di 127.0.0.1:6443 dan IP pod terjangkau langsung.
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Dibatasi waktu dan ukuran, supaya tidak ikut mengisi disk bersama.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus:/etc/prometheus:ro
      - ./secrets/k8s:/etc/prometheus-k8s:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:13.2.2
    container_name: platform-grafana
    restart: unless-stopped
    # Network host supaya Prometheus (127.0.0.1:9090) terjangkau; tampilannya
    # tetap hanya di 127.0.0.1:3000, dibuka dari PC lewat SSH port forwarding.
    network_mode: host
    env_file: env/grafana.env
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    # 256m terlalu sempit: Grafana 13 sudah memakai ~244 MiB saat baru start.
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    container_name: platform-jaeger
    restart: unless-stopped
    command: ["--config", "/etc/jaeger/config.yaml"]
    ports:
      - "127.0.0.1:16686:16686"   # tampilan Jaeger
      # OTLP HTTP: dari PC lewat SSH port forwarding, dan dari pod di k3s.
      - "127.0.0.1:4318:4318"
      - "172.30.0.1:4318:4318"
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    mem_limit: 256m

volumes:
  postgres_data:
  mysql_data:
  redis_data:
  garage_meta:
  garage_data:
  registry_data:
  jenkins_home:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: platform
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
