# Prometheus platform. Berjalan di network host, jadi 127.0.0.1 adalah VPS,
# API k3s ada di 127.0.0.1:6443, dan IP pod bisa dijangkau langsung.
#
# Setiap deret wajib punya label env, project, dan service. Untuk pod di
# namespace <project>-<env>, label itu diturunkan dari nama namespace; untuk
# komponen platform, project=platform.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels: { env: dev, project: platform, service: prometheus }

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels: { env: dev, project: platform, service: node }

  # Pemakaian CPU, memori, dan jaringan setiap container, dibaca dari kubelet
  # lewat API server.
  - job_name: kubelet-cadvisor
    scheme: https
    tls_config: { ca_file: /etc/prometheus-k8s/ca.crt }
    authorization: { credentials_file: /etc/prometheus-k8s/token }
    kubernetes_sd_configs:
      - role: node
        api_server: https://127.0.0.1:6443
        tls_config: { ca_file: /etc/prometheus-k8s/ca.crt }
        authorization: { credentials_file: /etc/prometheus-k8s/token }
    relabel_configs:
      - target_label: __address__
        replacement: 127.0.0.1:6443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
      # Label dasar target, untuk deret buatan Prometheus sendiri (up,
      # scrape_*). Deret container menimpanya di metric_relabel_configs.
      - { target_label: env, replacement: dev }
      - { target_label: project, replacement: platform }
      - { target_label: service, replacement: kubelet }
    metric_relabel_configs:
      # Hanya metrik yang dipakai dashboard, supaya jumlah deret tetap kecil.
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|network_receive_bytes_total|network_transmit_bytes_total)
        action: keep
      # Deret tingkat pod (tanpa nama container) dan sandbox "POD" dibuang.
      - source_labels: [container]
        regex: "|POD"
        action: drop
      - &project_dari_namespace
        source_labels: [namespace]
        regex: (.+)-(dev|prod)
        target_label: project
        replacement: $1
      - &env_dari_namespace
        source_labels: [namespace]
        regex: (.+)-(dev|prod)
        target_label: env
        replacement: $2
      - source_labels: [container]
        target_label: service
      # Namespace platform (kube-system, argocd, ...) tidak mengikuti pola.
      - &project_platform
        source_labels: [project]
        regex: ""
        target_label: project
        replacement: platform
      - &env_dev
        source_labels: [env]
        regex: ""
        target_label: env
        replacement: dev

  # Metrik aplikasi dari pod yang meminta di-scrape lewat anotasi
  # prometheus.io/scrape, prometheus.io/port, dan prometheus.io/path.
  - job_name: pods
    kubernetes_sd_configs:
      - role: pod
        api_server: https://127.0.0.1:6443
        tls_config: { ca_file: /etc/prometheus-k8s/ca.crt }
        authorization: { credentials_file: /etc/prometheus-k8s/token }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: (.+);(.+)
        target_label: __address__
        replacement: $1:$2
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      # Nama service dari label standar app.kubernetes.io/name, lalu ditimpa
      # label app kalau ada. Pod Traefik hanya punya yang standar.
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: (.+)
        target_label: service
      - <<: *project_dari_namespace
      - <<: *env_dari_namespace
      - <<: *project_platform
      - <<: *env_dev
