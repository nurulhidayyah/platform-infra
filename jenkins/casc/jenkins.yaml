# Konfigurasi Jenkins sebagai kode. Perubahan lewat UI hilang saat container
# dibuat ulang; ubah berkas ini, lalu `make up`.
jenkins:
  systemMessage: "Jenkins platform Dev. Konfigurasinya di platform-infra/jenkins/casc."
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    # Alamat yang dilihat dari PC lewat SSH port forwarding.
    url: "http://localhost:8090/"
  gitHubPluginConfig:
    hookSecretConfigs:
      - credentialsId: github-webhook-secret

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: platform-gitops-deploy-key
              username: git
              description: "Deploy key platform-gitops (tulis)"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/gitops-deploy-key}"
          - string:
              scope: GLOBAL
              id: github-webhook-secret
              description: "Secret webhook GitHub"
              secret: "${GITHUB_WEBHOOK_SECRET}"

# Satu job per repo service. Job dipicu webhook GitHub setiap ada push; isi
# pipeline-nya ada di Jenkinsfile repo service itu sendiri.
jobs:
  - script: |
      pipelineJob('contoh-hello') {
        description('Service hello di contoh-dev. Dipicu webhook GitHub setiap push ke main.')
        properties {
          pipelineTriggers {
            triggers {
              githubPush()
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/nurulhidayyah/contoh-hello.git') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
      pipelineJob('timesheet-app') {
        description('Aplikasi timesheet di timesheet-prod. Dipicu webhook GitHub setiap push ke main.')
        properties {
          pipelineTriggers {
            triggers {
              githubPush()
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/nurulhidayyah/timesheet-app.git') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
