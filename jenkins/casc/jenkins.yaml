# Konfigurasi Jenkins sebagai kode. Perubahan lewat UI hilang saat container
# dibuat ulang; ubah berkas ini, lalu `make up`.
jenkins:
  systemMessage: "Jenkins platform Dev. Konfigurasinya di platform-infra/jenkins/casc."
  numExecutors: 2
  # Tanpa agent; lihat JENKINS_SLAVE_AGENT_PORT di compose.yaml.
  slaveAgentPort: -1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    # Alamat yang dilihat dari PC lewat SSH port forwarding.
    url: "http://localhost:8090/"
  gitHubPluginConfig:
    hookSecretConfigs:
      - credentialsId: github-webhook-secret
  # Resep bersama servicePipeline (jenkins/lib di repo ini), dimuat otomatis di
  # setiap pipeline. Versinya branch main: perubahan resep berlaku setelah
  # dev di-merge ke main. Untuk mencoba versi lain dari sebuah Jenkinsfile:
  # @Library('platform@dev') _
  globalLibraries:
    libraries:
      - name: platform
        defaultVersion: main
        implicit: true
        allowVersionOverride: true
        includeInChangesets: false
        retriever:
          modernSCM:
            libraryPath: jenkins/lib/
            scm:
              git:
                remote: https://github.com/nurulhidayyah/platform-infra.git

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: platform-gitops-deploy-key
              username: git
              description: "Deploy key platform-gitops (tulis)"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/gitops-deploy-key}"
          # GitHub App nurulhidayyah-platform-jenkins, terpasang di semua repo akun:
          # membaca repo (termasuk yang privat), menerima webhook-nya, dan
          # memasang status build di commit. Kuncinya PKCS#8.
          - gitHubApp:
              id: github-app
              appID: "5087073"
              description: "GitHub App nurulhidayyah-platform-jenkins"
              privateKey: "${readFile:/run/secrets/github-app.pem}"
          - string:
              scope: GLOBAL
              id: github-webhook-secret
              description: "Secret webhook GitHub"
              secret: "${GITHUB_WEBHOOK_SECRET}"

# Satu folder yang memindai akun GitHub. Setiap repo yang punya Jenkinsfile
# otomatis menjadi job, dengan satu cabang job per branch dan pull request;
# repo baru dan push dikabarkan lewat webhook GitHub App. Menambah service
# tidak perlu mengubah berkas ini. Pull request dari fork tidak dibangun.
jobs:
  - script: |
      organizationFolder('github') {
        displayName('GitHub nurulhidayyah')
        description('Repo di github.com/nurulhidayyah yang punya Jenkinsfile. Deploy hanya dari branch main.')
        organizations {
          github {
            repoOwner('nurulhidayyah')
            apiUri('https://api.github.com')
            credentialsId('github-app')
            traits {
              gitHubExcludeArchivedRepositories()
              gitHubBranchDiscovery { strategyId(1) }
              gitHubPullRequestDiscovery { strategyId(1) }
            }
          }
        }
        projectFactories {
          workflowMultiBranchProjectFactory { scriptPath('Jenkinsfile') }
        }
        orphanedItemStrategy { discardOldItems {} }
        triggers { periodicFolderTrigger { interval('1d') } }
      }
